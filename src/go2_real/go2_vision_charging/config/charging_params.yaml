# 二维码检测参数
aruco:
  target_id: 88              # 目标二维码ID
  marker_length: 0.184        # 二维码边长(米)
  
# 几何参数
geometry:
  offset_x: 0.0              # 充电口相对二维码左右偏移(米)
  offset_y: -0.616            # 充电口相对二维码上下偏移(米)
  offset_z: -1.00           # 充电口相对二维码前后偏移(米)
  target_dock_dist: -0.00     # 目标停靠距离(米)

# PID控制参数
pid:
  k_p_x: 0.5                 # 前后P增益
  k_p_y: 0.8                 # 左右P增益
  k_p_z: 1.2                 # 旋转P增益 (提高角度响应)
  k_i_x: 0.05                # 前后I增益
  k_i_y: 0.05                # 左右I增益
  k_i_z: 0.08                # 旋转I增益 (提高角度稳态精度)
  k_d_x: 0.1                 # 前后D增益
  k_d_y: 0.1                 # 左右D增益
  k_d_z: 0.15                # 旋转D增益 (减少角度震荡)
  
# 速度限制
limits:
  max_v_x: 0.15               # 最大前后速度(m/s)
  max_v_y: 0.10               # 最大左右速度(m/s)
  max_w_z: 0.4               # 最大角速度(rad/s) - 提高以改善大角度响应
  
# 误差容忍
tolerance:
  dist: 0.50                 # 距离容差(米) 0.07
  lateral: 0.50              # 横向容差(米) 0.04
  yaw: 0.5                  # 角度容差(弧度) (~4.6度) - 放宽以避免震荡 0.1
  
# 超时配置
timeout:
  aruco_lost: 2.0            # 二维码丢失超时(秒)
  search: 10.0               # 搜索超时(秒)
  align: 30.0                # 对接超时(秒)
  
# 滤波参数
filter:
  alpha: 0.3                 # 低通滤波系数(0-1)

# ============ 新增: 角度估计改进参数 ============  (目前还没用，如果需要可以使用)
# 角度融合权重:
#   0.0 = 完全使用二维码姿态角 (适合小角度、近距离)
#   1.0 = 完全使用atan2几何角度 (适合大角度、远距离)
#   0.7 = 推荐默认值 (平衡两者)
angle_fusion_weight: 0.7

# 调试建议:
# 1. 如果大角度(>30°)时角度估计偏小 -> 增大angle_fusion_weight到0.8-0.9
# 2. 如果小角度(<15°)时控制震荡 -> 减小angle_fusion_weight到0.5-0.6
# 3. 如果角度噪声大 -> 保持0.7并检查相机标定质量