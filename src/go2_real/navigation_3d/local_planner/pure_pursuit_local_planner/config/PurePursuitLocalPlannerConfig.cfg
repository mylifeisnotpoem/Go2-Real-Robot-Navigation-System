#!/usr/bin/env python

PACKAGE = "pure_pursuit_local_planner"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# Pure Pursuit parameters
gen.add("lookahead_distance_min", double_t, 0, "Minimum lookahead distance", 1.0, 0.5, 5.0)
gen.add("lookahead_distance_max", double_t, 0, "Maximum lookahead distance", 3.0, 1.0, 10.0)
gen.add("lookahead_ratio", double_t, 0, "Lookahead distance to velocity ratio", 2.0, 0.5, 5.0)
gen.add("goal_tolerance", double_t, 0, "Goal tolerance", 0.2, 0.1, 1.0)

# Speed parameters
gen.add("max_linear_velocity", double_t, 0, "Maximum linear velocity", 1.0, 0.1, 3.0)
gen.add("max_angular_velocity", double_t, 0, "Maximum angular velocity", 1.0, 0.1, 3.0)
gen.add("min_linear_velocity", double_t, 0, "Minimum linear velocity", 0.1, 0.0, 1.0)

# Obstacle avoidance parameters
gen.add("safety_distance", double_t, 0, "Safety distance from obstacles", 0.3, 0.1, 1.0)
gen.add("critical_distance", double_t, 0, "Critical distance threshold", 0.8, 0.2, 2.0)
gen.add("angular_avoidance_gain", double_t, 0, "Angular avoidance gain", 2.0, 0.1, 5.0)

# Obstacle detection data sources
gen.add("use_laser_scan", bool_t, 0, "Use laser scan for obstacle detection", True)
gen.add("use_costmap", bool_t, 0, "Use costmap for obstacle detection", True)

# Path stability parameters
gen.add("path_similarity_threshold", double_t, 0, "Path similarity threshold for stability", 0.8, 0.0, 1.0)
gen.add("enable_path_smoothing", bool_t, 0, "Enable path smoothing", True)
gen.add("stability_check_frequency", int_t, 0, "Stability check frequency", 3, 1, 10)

# Local planning control parameters
gen.add("enable_local_replanning", bool_t, 0, "Enable A* local replanning", False)
gen.add("use_smoothed_path", bool_t, 0, "Use smoothed local path", False)

exit(gen.generate(PACKAGE, "pure_pursuit_local_planner", "PurePursuitLocalPlanner"))
